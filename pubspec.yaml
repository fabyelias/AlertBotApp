name: alertbot_app
description: "AlertBot — App de seguridad vecinal (registro y activación de alertas)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  porcupine_flutter: ^4.0.0
  permission_handler: ^13.0.2
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/wakewords/
    - assets/icono/

# Genera los íconos nativos: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path: "assets/icono/icono.png"
  adaptive_icon_background: "#1E7A46"
  adaptive_icon_foreground: "assets/icono/icono_foreground.png"
  remove_alpha_ios: true

# Genera la splash screen nativa: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F7FAF8"
  image: assets/icono/splash_logo.png
  android_12:
    color: "#F7FAF8"
    image: assets/icono/icono_foreground.png
    icon_background_color: "#1E7A46"
